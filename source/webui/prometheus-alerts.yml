# Example Prometheus alert rules for logdir.  Copy this file next to prometheus.yml, list it under rule_files:, and adjust the
# thresholds.  The first rule expects the scrape job to be called "logdir"; change that name to match yours.
groups:
  - name: logdir
    rules:
      - alert: LogdirNodeDown
        expr: up{job="logdir"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} cannot be scraped"
      - alert: LogdirChronyNotRunning
        expr: logdir_chrony_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: chrony is not running"
      - alert: LogdirNotSynchronised
        expr: logdir_chrony_synchronised == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: the clock is not synchronised"
      - alert: LogdirClockOffset
        expr: abs(logdir_chrony_offset_ms) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: the clock is more than 100 ms off"
      - alert: LogdirHighStratum
        expr: logdir_chrony_stratum >= 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: stratum {{ $value }}"
      - alert: LogdirNoReachableSource
        expr: sum by (instance) (logdir_chrony_source_reach) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: chrony has not heard from any source"
      - alert: LogdirNoActiveGateway
        expr: sum by (group, af) (logdir_gateway_active) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No node is the active gateway of group {{ $labels.group }} ({{ $labels.af }})"
      - alert: LogdirGatewayNotListening
        expr: logdir_gateway_service_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: the NTP listener of group {{ $labels.group }} is down"
      - alert: LogdirUpstreamDown
        expr: logdir_upstream_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: upstream server {{ $labels.server }} is down"
      - alert: LogdirFalseticker
        expr: logdir_upstream_falseticker == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: upstream server {{ $labels.server }} disagrees with the others"
      - alert: LogdirCriticalAlertOpen
        expr: logdir_alerts_active{severity="critical"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: a critical alert has been open for 10 minutes (see Monitor ▸ Alerts)"
      - alert: LogdirCertificateExpiresSoon
        expr: logdir_certificate_expires_in_seconds < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: the {{ $labels.certificate }} certificate expires in less than 14 days"
      - alert: LogdirCertificateExpiresVerySoon
        expr: logdir_certificate_expires_in_seconds < 3 * 86400
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: the {{ $labels.certificate }} certificate expires in less than 3 days"
      - alert: LogdirHostCPU
        expr: logdir_host_cpu_percent > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: CPU above 90% for 15 minutes"
      - alert: LogdirHostMemory
        expr: logdir_host_memory_used_bytes / logdir_host_memory_total_bytes > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: more than 90% of the memory is in use"
      - alert: LogdirFilesystemFull
        expr: logdir_host_filesystem_used_percent > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mount }} is more than 90% full"
